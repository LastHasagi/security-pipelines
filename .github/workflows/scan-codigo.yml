# Analise estatica: segredos no historico, codigo e dependencias.
# Roda no repo que chama, entao relatorio e log ficam com a visibilidade dele.
name: scan-codigo

on:
  workflow_call:
    inputs:
      dir_node:
        description: Pasta com package-lock.json. Vazio pula o npm audit.
        type: string
        default: ""
      imagens:
        description: 'Uma imagem por linha: "contexto dockerfile". Vazio pula o Trivy.'
        type: string
        default: ""
      bloquear:
        description: Achado falha o job. Comece em false para levantar o passivo.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # --redact: o relatorio aponta o arquivo e o commit, nunca o valor.
      - name: gitleaks
        continue-on-error: ${{ !inputs.bloquear }}
        run: |
          mkdir -p relatorios
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact \
            --report-format json --report-path /repo/relatorios/gitleaks.json
      - if: always()
        run: echo "gitleaks - $(jq length relatorios/gitleaks.json) achados" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorio-segredos
          path: relatorios/
          retention-days: 30

  codigo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        continue-on-error: ${{ !inputs.bloquear }}
        run: |
          mkdir -p relatorios
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.183.0 semgrep scan --metrics=off --error \
            --config p/owasp-top-ten --config p/python --config p/typescript \
            --config p/react --config p/dockerfile --config p/github-actions \
            --exclude relatorios --json --output relatorios/semgrep.json
      - if: always()
        run: |
          jq -r '"semgrep - \(.results | length) achados"' relatorios/semgrep.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "- `\(.path):\(.start.line)` \(.extra.severity) \(.check_id | split(".") | last)"' \
            relatorios/semgrep.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorio-codigo
          path: relatorios/
          retention-days: 30

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p relatorios
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: hashFiles('uv.lock') != ''
      - name: pip-audit
        if: hashFiles('uv.lock') != ''
        continue-on-error: ${{ !inputs.bloquear }}
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt" -q
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip \
            -f json -o relatorios/pip-audit.json
      - name: npm audit
        if: inputs.dir_node != ''
        continue-on-error: ${{ !inputs.bloquear }}
        env:
          DIR_NODE: ${{ inputs.dir_node }}
        run: |
          raiz="$PWD"
          cd "$DIR_NODE"
          npm audit --omit=dev --json > "$raiz/relatorios/npm-audit.json"
      - if: always()
        run: |
          # Cada CVE vira linha no resumo e anotação ::error:: na página do run.
          if [ -f relatorios/pip-audit.json ]; then
            jq -r '"pip-audit - \([.dependencies[].vulns[]?] | length) vulnerabilidades"' \
              relatorios/pip-audit.json >> "$GITHUB_STEP_SUMMARY"
            jq -r '.dependencies[] | select(.vulns | length > 0)
              | "\(.name) \(.version): \([.vulns[].id] | join(", ")) - corrige em \([.vulns[].fix_versions[]] | unique | join(", ") | if . == "" then "sem versao" else . end)"' \
              relatorios/pip-audit.json | while read -r linha; do
                echo "- $linha" >> "$GITHUB_STEP_SUMMARY"; echo "::error title=CVE python::$linha"
              done
          fi
          if [ -f relatorios/npm-audit.json ]; then
            jq -r '"npm audit - \(.metadata.vulnerabilities.total) vulnerabilidades"' \
              relatorios/npm-audit.json >> "$GITHUB_STEP_SUMMARY"
            jq -r '.vulnerabilities | to_entries[]
              | .value.via as $via
              | "\(.key) (\(.value.severity)): \([$via[] | objects | .url] | unique | join(", ") | if . == "" then "via \([$via[] | strings] | join(", "))" else . end)"' \
              relatorios/npm-audit.json | while read -r linha; do
                echo "- $linha" >> "$GITHUB_STEP_SUMMARY"; echo "::error title=CVE npm::$linha"
              done
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorio-dependencias
          path: relatorios/
          retention-days: 30

  imagens:
    if: inputs.imagens != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pacote do sistema e binário (Go, npm e pip da imagem base) que o audit das libs
      # não enxerga. Só conta CVE com correção publicada; de qualquer severidade.
      - name: trivy
        continue-on-error: ${{ !inputs.bloquear }}
        env:
          IMAGENS: ${{ inputs.imagens }}
        run: |
          mkdir -p relatorios
          falhou=0
          while read -r contexto dockerfile; do
            [ -z "$contexto" ] && continue
            nome=$(echo "$dockerfile" | tr '/.A-Z' '--a-z')
            docker build -q -t "scan/$nome" -f "$dockerfile" "$contexto" > /dev/null
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.69.3 image --quiet --ignore-unfixed --exit-code 1 --format json \
              "scan/$nome" > "relatorios/trivy-$nome.json" || falhou=1
          done <<< "$IMAGENS"
          exit $falhou
      - if: always()
        run: |
          for f in relatorios/trivy-*.json; do
            [ -f "$f" ] || continue
            nome=$(basename "$f" .json | sed 's/^trivy-//')
            jq -r --arg n "$nome" '"trivy \($n) - \([.Results[]?.Vulnerabilities[]?] | length) vulnerabilidades"' "$f" >> "$GITHUB_STEP_SUMMARY"
            jq -r '[.Results[]? | .Vulnerabilities[]? | "\(.PkgName) \(.InstalledVersion) [\(.Severity)] \(.VulnerabilityID) - corrige em \(.FixedVersion)"] | unique | .[]' \
              "$f" | while read -r linha; do
                echo "- $linha" >> "$GITHUB_STEP_SUMMARY"; echo "::error title=CVE imagem $nome::$linha"
              done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relatorio-imagens
          path: relatorios/
          retention-days: 30
